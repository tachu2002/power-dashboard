name: 三島カメラ電源データ取得

on:
  schedule:
    # 5分間隔(GitHub無料枠のスケジュール実行は「ベストエフォート」のため、
    # 混雑時は実際の実行間隔が数分〜十数分程度になることがあります)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# 前回の実行が終わる前に次の実行が始まらないようにし、
# git push が競合しないようにする
concurrency:
  group: poll-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 全拠点のデータを取得してdata/配下を更新
        run: node scripts/poll.mjs

      - name: 変更があればコミット・push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.csv data/recent.csv data/latest.json
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
            exit 0
          fi
          git commit -m "データ自動更新: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push失敗。再試行します ($i/3)..."
            git pull --rebase
            sleep 5
          done
          echo "pushに失敗しました" >&2
          exit 1
